name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright's Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
      - name: Engine test suites (node --test)
        run: npm test
      - name: Unit tests (vitest)
        run: npm run test:unit
      # The real-socket / worker suites live in their own vitest project
      # (vitest.net.config.mjs) because they can't share a worker pool with the
      # pure ones. They were a defined gate that CI never ran.
      - name: Networked suites (vitest, real sockets + workers)
        run: npm run test:net
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (editor + player + passthrough runtime)
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    env:
      RENDERER_GOLDEN_CACHE_KEY: rpgatlas-renderer-goldens-linux-v1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Beacon server bundle for relay E2E tests
        run: node server/build.mjs
      - name: Install Playwright's Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
      - name: Restore Linux renderer golden baseline
        id: renderer-goldens
        uses: actions/cache/restore@v4
        with:
          path: tests-e2e/__snapshots__/linux
          key: ${{ env.RENDERER_GOLDEN_CACHE_KEY }}
      - name: Bootstrap Linux renderer golden baseline on main
        if: steps.renderer-goldens.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        run: >-
          npx playwright test tests-e2e/renderer-golden.spec.mjs
          --grep "renderer golden images" --update-snapshots
      - name: Verify Linux renderer golden baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="tests-e2e/__snapshots__/linux/renderer-golden.spec.mjs"
          expected=(
            hd2d-meridian-village.png
            hd2d-post-meridian-village.png
            hd2d-shadows-meridian-village.png
            hd2d-pointshadows-meridian-village.png
            hd2d-water-meridian-village.png
            hd2d-materials-meridian-village.png
            hd2d-post2-meridian-village.png
            hd2d-dusk-meridian-village.png
            hd2d-rain-meridian-village.png
            hd2d-cliffs-meridian-village.png
            classic2d-meridian-village.png
          )
          for file in "${expected[@]}"; do
            test -s "$baseline_dir/$file" || {
              echo "Missing Linux renderer baseline: $baseline_dir/$file" >&2
              exit 1
            }
          done
      - name: Save Linux renderer golden baseline
        if: steps.renderer-goldens.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: tests-e2e/__snapshots__/linux
          key: ${{ env.RENDERER_GOLDEN_CACHE_KEY }}
      - name: E2E + golden-image tests (builds first — see playwright.config.mjs webServer)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
