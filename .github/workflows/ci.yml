name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright's Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
      - name: Engine test suites (node --test)
        run: npm test
      - name: Unit tests (vitest)
        run: npm run test:unit
      # The real-socket / worker suites live in their own vitest project
      # (vitest.net.config.mjs) because they can't share a worker pool with the
      # pure ones. They were a defined gate that CI never ran.
      - name: Networked suites (vitest, real sockets + workers)
        run: npm run test:net
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Documentation freshness and link check
        run: npm run docs:check
      - name: Build (editor + player + passthrough runtime)
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Beacon server bundle for relay E2E tests
        run: node server/build.mjs
      - name: Install Playwright's Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
      - name: E2E + golden-image tests (builds first — see playwright.config.mjs webServer)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
