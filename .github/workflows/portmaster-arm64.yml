name: Experimental PortMaster ARM64 package

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project JSON path in the repository
        required: true
        default: Atlas_Quest.json
        type: string
      screenshot:
        description: 4:3 gameplay PNG path in the repository (640x480 minimum)
        required: true
        type: string

jobs:
  package:
    # The ARM runner is intentional: Tauri's Linux AppImage tooling is not used
    # and this job builds the native aarch64 game binary in its target ABI.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build PortMaster package
        run: >-
          npm run package:portmaster --
          "${{ inputs.project }}"
          --screenshot "${{ inputs.screenshot }}"
          --out "${{ inputs.project }}.portmaster.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rpgatlas-portmaster-arm64
          path: "${{ inputs.project }}.portmaster.zip"
